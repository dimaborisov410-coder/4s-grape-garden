  const days = [];
  let dayNum = 0;
  SCHEDULE_WEEKS.forEach(week => {
    week.dates.forEach((dateStr, idx) => {
      dayNum++;
      const [d,m] = dateStr.split('.').map(Number);
      const dt = new Date(2026, m-1, d);
      const dow = DOW[dt.getDay()];
      days.push({ dayNum, dateStr, dow, weekLabel:week.label, weekRange:week.range, isWeekStart: idx===0 });
    });
  });
  return days;
}

/* ─── ПОЛУЧИТЬ ЗАДАЧУ БРИГАДЫ ДЛЯ ДНЯ N ─── */
function getBrigadeTask(brigadeKey, dayNum) {
  const plan = BRIGADE_PLAN[brigadeKey];
  for (const seg of plan) {
    if (dayNum >= seg.d[0] && dayNum <= seg.d[1]) return seg;
  }
  return { type:'mgmt', task:'—', target:null };
}

/* ─── ПОЛУЧИТЬ МАТЕРИАЛЫ ДЛЯ ДНЯ N ─── */
function getMaterials(dayNum) {
  if (MATERIALS[dayNum]) return MATERIALS[dayNum];
  if (dayNum >= 1 && dayNum <= 3) return MATERIALS[1];
  return null;
}

/* ─── РЕНДЕР KPI ─── */
function renderKPI() {
  const today = new Date();
  const start = new Date(2026,4,22);
  const finish = new Date(2026,7,29);
  const diffStart = Math.max(0, Math.floor((today-start)/(1000*60*60*24)));
  const diffFinish = Math.max(0, Math.floor((finish-today)/(1000*60*60*24)));
  const currentDay = Math.min(86, diffStart+1);
  return `<div class="kpi-grid">
    <div class="kpi">
      <div class="lbl">Сегодня</div>
      <div class="big">${currentDay > 86 ? '✓' : currentDay}</div>
      <div class="sub">день из 86<br>${today.toLocaleDateString('ru-RU')}</div>
    </div>
    <div class="kpi warn">
      <div class="lbl">До сдачи</div>
      <div class="big">${diffFinish}</div>
      <div class="sub">дней осталось<br>сдача 29.08.2026</div>
    </div>
    <div class="kpi">
      <div class="lbl">Капля план</div>
      <div class="big">217К</div>
      <div class="sub">м всего · 86 дней<br>4 225 м/день с Н9</div>
    </div>
    <div class="kpi red">
      <div class="lbl">Дефицит</div>
      <div class="big">25 900</div>
      <div class="sub" style="color:#c62828">м при 13 рабочих<br>нужно +2–3 чел. с 01.07</div>
    </div>
  </div>`;
}

/* ─── РЕНДЕР ЛЕГЕНДЫ ─── */
function renderLegend() {
  const colors = {
    ns:'#e3f2fd', ge:'#fff8e1', mag:'#e8eaf6', lat:'#f3e5f5',
    drip:'#e8f5e9', val:'#fce4ec', pnr:'#e0f2f1', mgmt:'#fff3e0'
  };
  return `<div class="legend">${
    Object.entries(WT).map(([k,v])=>
      `<div class="leg-item"><div class="leg-box" style="background:${colors[k]}; border:1px solid #ccc"></div>${v.label}</div>`
    ).join('')
  }</div>`;
}

/* ─── РЕНДЕР ЯЧЕЙКИ БРИГАДЫ ─── */
function renderBCell(seg, cum) {
  const w = WT[seg.type] || WT.mgmt;
  const cumStr = cum ? `<br><small style="color:#888">нараст.: ${cum.toLocaleString('ru-RU')} м</small>` : '';
  return `<td class="b-cell">
    <div class="b-type ${w.css}">${w.label}</div>
    <div class="b-task">${seg.task}</div>
    ${seg.target ? `<div class="b-target">⟶ <b>${seg.target}</b>${cumStr}</div>` : (cum ? `<div class="b-target">${cumStr}</div>` : '')}
  </td>`;
}

/* ─── РЕНДЕР МАТЕРИАЛОВ ─── */
function renderMatsCell(mats) {
  if (!mats || mats.length === 0) return `<td class="mat-cell"><span style="color:#bbb;font-size:7pt">—</span></td>`;
  const icons = { ok:'✅', warn:'⚠️', bad:'❌', unk:'❓' };
  const cls   = { ok:'mat-ok', warn:'mat-warn', bad:'mat-bad', unk:'mat-unk' };
  return `<td class="mat-cell">${mats.map(m=>
    `<div class="mat-item ${cls[m.s]}">${icons[m.s]} ${m.t}</div>`
  ).join('')}</td>`;
}

/* ─── РЕНДЕР СТРОКИ КОНТРОЛЬНОЙ ТОЧКИ ─── */
function renderMilestone(ms) {
  const isFinal = ms.type === 'final';
  return `<tr class="milestone-row ${isFinal?'kt-final':''}">
    <td colspan="5">
      <span class="ms-label">🏁 ${ms.label}</span>
      <span class="ms-desc"> — ${ms.desc}</span>
    </td>
  </tr>`;
}

/* ─── РЕНДЕР ПОЛНОЙ ТАБЛИЦЫ ─── */
function renderTable(days) {
  let dripCumA=0, dripCumB=0, dripCumC=0;

  /* Разрывы страниц перед месяцами: день 22 (Н5), день 46 (Н9), день 64 (Н12) */
  const pageBreakBefore = new Set([22, 46, 64]);

  let rows = `<thead><tr>
    <th style="width:65px">Дата</th>
    <th style="width:22%">Бр.А · 5 чел. ГС<br><small style="font-weight:400;opacity:.8">Примачок, Темников, Швец-Роговой, Васильев, Рыков</small></th>
    <th style="width:22%">Бр.Б · 4 чел. ГС<br><small style="font-weight:400;opacity:.8">Прусаков, Борисов Д., Борисов А., Браковенко</small></th>
    <th style="width:22%">Бр.В · 4 чел. СУЛАНЖ<br><small style="font-weight:400;opacity:.8">Костров, Моисеенко, Божко, Высидалко</small></th>
    <th style="width:22%">Материалы · статус</th>
  </tr></thead><tbody>`;

  days.forEach(day => {
    const n = day.dayNum;

    if (day.isWeekStart) {
      const pb = pageBreakBefore.has(n) ? 'style="page-break-before:always"' : '';
      rows += `<tr class="week-sep" ${pb}>
        <td colspan="4"><b>${day.weekLabel}</b> · ${day.weekRange} · 2026</td>
        <td class="ws-right">ИТР: Шпилёв А.А. (координация) · Яковлев А. (снабжение)</td>
      </tr>`;
    }

    if (MILESTONES[n]) rows += renderMilestone(MILESTONES[n]);

    const segA = getBrigadeTask('A', n);
    const segB = getBrigadeTask('B', n);
    const segC = getBrigadeTask('C', n);

    if (segA.type === 'drip') dripCumA += 1625;
    if (segB.type === 'drip') dripCumB += 1300;
    if (segC.type === 'drip') dripCumC += 1300;

    const cumA = segA.type === 'drip' ? dripCumA : null;
    const cumB = segB.type === 'drip' ? dripCumB : null;
    const cumC = segC.type === 'drip' ? dripCumC : null;

    const mats = getMaterials(n);

    rows += `<tr>
      <td>
        <div class="d-date">${day.dateStr}</div>
        <div class="d-dow">${day.dow}</div>
        <div class="d-day">День ${n}/86</div>
      </td>
      ${renderBCell(segA, cumA)}
      ${renderBCell(segB, cumB)}
      ${renderBCell(segC, cumC)}
      ${renderMatsCell(mats)}
    </tr>`;
  });

  rows += `</tbody>`;
  return `<table>${rows}</table>`;
}
