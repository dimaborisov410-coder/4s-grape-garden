<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<title>Документы · 4S Grape Garden</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#111a10;color:rgba(255,255,255,.78);display:flex;flex-direction:column}

/* HEADER */
.hdr{
  background:#0d1a0f;
  border-bottom:1px solid rgba(201,168,76,.12);
  display:flex;align-items:center;
  padding:0 12px;gap:0;
  height:48px;flex-shrink:0;
  overflow-x:auto;
}
.hdr::-webkit-scrollbar{display:none}

.back-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(201,168,76,.08);
  border:1px solid rgba(201,168,76,.2);
  border-radius:7px;
  padding:5px 11px;
  color:rgba(201,168,76,.85);
  font-size:11px;font-weight:700;
  white-space:nowrap;flex-shrink:0;
  text-decoration:none;
  transition:background .15s;
  margin-right:12px;
}
.back-btn:hover{background:rgba(201,168,76,.16)}
.back-btn svg{width:13px;height:13px;flex-shrink:0}

.logo{
  color:rgba(201,168,76,.55);
  font-size:9px;font-weight:900;letter-spacing:1.5px;
  white-space:nowrap;flex-shrink:0;
  margin-right:14px;
}

.sep{width:1px;height:22px;background:rgba(201,168,76,.15);flex-shrink:0;margin-right:10px}

/* TABS */
.tabs{display:flex;align-items:center;gap:3px;flex-shrink:0}
.tab{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;
  border-radius:7px;
  border:1px solid transparent;
  background:transparent;
  color:rgba(255,255,255,.38);
  font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:all .15s;
  font-family:inherit;
}
.tab:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.04)}
.tab.active{
  background:rgba(201,168,76,.12);
  border-color:rgba(201,168,76,.25);
  color:rgba(201,168,76,.9);
}
.tab-icon{font-size:13px;line-height:1}

.ext-btn{
  margin-left:auto;flex-shrink:0;
  display:flex;align-items:center;gap:4px;
  background:transparent;border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:5px 10px;
  color:rgba(255,255,255,.35);font-size:10px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:all .15s;
  font-family:inherit;text-decoration:none;
  margin-left:12px;
}
.ext-btn:hover{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.22)}
.ext-btn svg{width:12px;height:12px}

/* IFRAME AREA */
.frame-wrap{flex:1;position:relative;overflow:hidden}
iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;
  background:#fff;
  opacity:0;transition:opacity .2s;
}
iframe.loaded{opacity:1}

/* LOADING INDICATOR */
.loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;pointer-events:none;
}
.loading-ring{
  width:36px;height:36px;
  border:3px solid rgba(201,168,76,.15);
  border-top-color:rgba(201,168,76,.7);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
.loading-text{color:rgba(201,168,76,.5);font-size:12px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.loading.hidden{display:none}

/* MOBILE: hide logo, collapse tabs to icons only */
@media(max-width:600px){
  .logo{display:none}
  .sep{display:none}
  .tab span.tab-label{display:none}
  .tab{padding:6px 9px}
  .ext-btn span{display:none}
  .ext-btn{padding:6px 8px}
}
</style>
</head>
<body>

<header class="hdr">
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Дашборд
  </a>

  <div class="logo">4S GG · DOCS</div>
  <div class="sep"></div>

  <div class="tabs">
    <button class="tab active" data-src="montage.html" onclick="switchTab(this)">
      <span class="tab-icon">📋</span><span class="tab-label">Регламент монтажа</span>
    </button>
    <button class="tab" data-src="schedule.html" onclick="switchTab(this)">
      <span class="tab-icon">📅</span><span class="tab-label">График работ</span>
    </button>
    <button class="tab" data-src="calc.html" onclick="switchTab(this)">
      <span class="tab-icon">🗒</span><span class="tab-label">Шпаргалка</span>
    </button>
    <button class="tab" data-src="daily.html" onclick="switchTab(this)">
      <span class="tab-icon">📆</span><span class="tab-label">Журнал (86 дней)</span>
    </button>
    <button class="tab" data-src="field-map.html" onclick="switchTab(this)">
      <span class="tab-icon">🗺</span><span class="tab-label">Схема поля</span>
    </button>
    <button class="tab" data-src="routine.html" onclick="switchTab(this)">
      <span class="tab-icon">⏰</span><span class="tab-label">Распорядок дня</span>
    </button>
  </div>

  <a class="ext-btn" id="open-ext" href="montage.html" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span>Открыть отдельно</span>
  </a>
</header>

<div class="frame-wrap">
  <div class="loading" id="loading">
    <div class="loading-ring"></div>
    <div class="loading-text">Загрузка документа…</div>
  </div>
  <iframe id="doc-frame" src="montage.html" onload="onFrameLoad()"></iframe>
</div>

<script>
const frame = document.getElementById('doc-frame');
const loading = document.getElementById('loading');
const extBtn = document.getElementById('open-ext');

function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const src = btn.dataset.src;
  loading.classList.remove('hidden');
  frame.classList.remove('loaded');
  frame.src = src;
  extBtn.href = src;
}

function onFrameLoad() {
  frame.classList.add('loaded');
  loading.classList.add('hidden');
}

// handle initial load
frame.addEventListener('load', onFrameLoad);
</script>
</body>
</html>
